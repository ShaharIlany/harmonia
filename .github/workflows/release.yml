# Builds Harmonia.app for every version tag (git tag v1.2.0 && git push origin v1.2.0) and publishes it as a GitHub
# release. Installed apps update from the latest release (updates.ts), and install.sh installs it.
# Every push to main gets the next patch tag from tag.yml, which starts this with workflow_dispatch on that tag
# (a tag pushed by a workflow doesn't trigger the tag push below).
#
# Beta or everyone: a build from a push to main is published as a PRERELEASE. Nobody gets it unless their
# settings.json says "updateChannel": "beta"; promote.yml makes it a full release (and the latest) later.
# A tag you push by hand (a minor or major version) is a full release at once, as before.
# Which is which is decided by how this run started, not by the tag's name: a push of a tag is always full; a
# workflow_dispatch is a prerelease unless its `prerelease` input says false (tag.yml also passes it explicitly).
# The event is the safer signal (a patch tag may be hand-made, and nothing tells a bot's tag from yours), and the
# default errs on the quiet side: a rebuild started by hand from the Actions page can't reach everyone by accident.
#
# Assets:
#   Harmonia-arm64.zip (+ .sha256)   the app (stable name: releases/latest/download/… works)
#   Team-Chat-arm64.zip (+ .sha256)  the same app as "Team Chat.app", for installs from before the rename: their
#                                    updater looks for that name. Drop it once no Team Chat installs are left.
#   Harmonia-windows-x64.zip (+ .sha256)  the Windows app (Harmonia.exe window + harmonia-server.exe + build.json) and
#                                    the starter teammates. Installed apps update from it (updates.ts).
#   Harmonia-Setup-x64.exe           the Windows installer (winapp/installer.iss)
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch: # run on a tag (Use workflow from: v1.2.3); tag.yml does this for its tags
    inputs:
      prerelease:
        description: Publish as a prerelease (beta channel). Promote it later with the Promote workflow.
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-15 # Apple Silicon; the app is arm64
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Tags look like v1.2.3, not $GITHUB_REF_NAME"; exit 1; }
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      # The transcriber for voice messages (macapp/transcribe.swift) needs the macOS 26 SDK, which comes with Xcode 26.
      - name: Xcode
        run: |
          X="$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)"
          if [ -n "$X" ]; then sudo xcode-select -s "$X"; fi
          xcodebuild -version
          xcrun --show-sdk-version

      - name: Build the app
        run: |
          HARMONIA_VERSION="$VERSION" HARMONIA_BRANCH=main \
            HARMONIA_REPO="https://github.com/${GITHUB_REPOSITORY}.git" bash macapp/build.sh --legacy
          ditto -c -k --sequesterRsrc --keepParent build/Harmonia.app Harmonia-arm64.zip
          ditto -c -k --sequesterRsrc --keepParent "build/Team Chat.app" Team-Chat-arm64.zip
          for z in Harmonia-arm64.zip Team-Chat-arm64.zip; do shasum -a 256 "$z" > "$z.sha256"; done
          cat build/Harmonia.app/Contents/Resources/build.json
          [ -x build/Harmonia.app/Contents/Resources/harmonia-transcribe ] || echo "::warning::No transcriber in this build: voice messages from Slack stay audio files. $(cat build/transcribe.log 2>/dev/null | grep -m1 error)"

      - name: Publish the release
        env:
          # A push of a tag is a full release. A dispatch is a prerelease unless the input says otherwise.
          PRERELEASE: ${{ github.event_name == 'workflow_dispatch' && inputs.prerelease }}
        run: |
          if [ "$PRERELEASE" = "true" ]; then CHANNEL="--prerelease"; else CHANNEL="--latest"; fi
          gh release create "$GITHUB_REF_NAME" Harmonia-arm64.zip Harmonia-arm64.zip.sha256 \
            Team-Chat-arm64.zip Team-Chat-arm64.zip.sha256 \
            --verify-tag $CHANNEL --title "Harmonia $VERSION" --generate-notes

  # The Windows app, built on Windows (the window is C#) and added to the release the Mac job made.
  windows:
    needs: release
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      WINDOWS_CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }} # optional: code-signing certificate (winapp/sign.ps1)
      WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Build the app
        shell: pwsh
        run: |
          $v = $env:GITHUB_REF_NAME -replace '^v', ''
          if ($v -notmatch '^\d+\.\d+\.\d+$') { throw "Tags look like v1.2.3, not $env:GITHUB_REF_NAME" }
          $env:HARMONIA_VERSION = $v
          $env:HARMONIA_BRANCH = "main"
          $env:HARMONIA_REPO = "https://github.com/$env:GITHUB_REPOSITORY.git"
          ./winapp/build.ps1
          Get-Content winapp/dist/build.json
          ./winapp/sign.ps1 winapp/dist/Harmonia.exe winapp/dist/harmonia-server.exe # no-op without the signing secrets

          # The update: the app's files and the starter teammates, in a folder of their own.
          $z = "build/Harmonia-windows-x64"
          New-Item -ItemType Directory -Force "$z/starter-agents" | Out-Null
          Copy-Item winapp/dist/* $z
          Copy-Item agents/*.md "$z/starter-agents/"
          Compress-Archive -Path $z -DestinationPath Harmonia-windows-x64.zip

          # The installer.
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          & $iscc "/DAppVersion=$v" winapp/installer.iss
          if ($LASTEXITCODE) { throw "installer failed" }
          ./winapp/sign.ps1 winapp/out/Harmonia-Setup-x64.exe
          Copy-Item winapp/out/Harmonia-Setup-x64.exe .

          # "<sha-256>  <name>", what updates.ts reads.
          foreach ($f in "Harmonia-windows-x64.zip", "Harmonia-Setup-x64.exe") {
            "$((Get-FileHash $f -Algorithm SHA256).Hash.ToLower())  $f" | Out-File "$f.sha256" -Encoding ascii
          }

      - name: Add to the release
        shell: pwsh
        run: gh release upload "$env:GITHUB_REF_NAME" Harmonia-windows-x64.zip Harmonia-windows-x64.zip.sha256 Harmonia-Setup-x64.exe Harmonia-Setup-x64.exe.sha256 --clobber
