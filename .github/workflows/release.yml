# Builds Team Chat.app for every version tag (git tag v1.2.0 && git push origin v1.2.0) and publishes it as a GitHub
# release. Installed apps update from the latest release (updates.ts), and install.sh installs it.
#
# Assets:
#   Team-Chat-arm64.zip (+ .sha256)  the app, without Laya's Python (stable name: releases/latest/download/… works)
#   laya-<ver>-py<py>-arm64.tar.gz   Laya's Python, in a release of its own (tag laya-<ver>-py<py>, a prerelease, so it's
#                                    never "latest"). Built only when macapp/laya.sh's stamp has no release yet.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-15 # Apple Silicon; the app and Laya's Python are arm64
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Tags look like v1.2.3, not $GITHUB_REF_NAME"; exit 1; }
          STAMP="$(bash macapp/laya.sh --stamp)"
          LAYA_TAG="laya-${STAMP/\//-py}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "LAYA_TAG=$LAYA_TAG" >> "$GITHUB_ENV"
          echo "LAYA_ASSET=$LAYA_TAG-arm64.tar.gz" >> "$GITHUB_ENV"

      - name: Does Laya's Python have a release?
        id: laya
        run: |
          if gh release view "$LAYA_TAG" --json assets --jq '.assets[].name' | grep -qx "$LAYA_ASSET"; then
            echo "missing=false" >> "$GITHUB_OUTPUT"
          else
            echo "missing=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: astral-sh/setup-uv@v6
        if: steps.laya.outputs.missing == 'true'

      - name: Build and publish Laya's Python
        if: steps.laya.outputs.missing == 'true'
        run: |
          bash macapp/laya.sh
          tar -C build/laya -czf "$LAYA_ASSET" .
          shasum -a 256 "$LAYA_ASSET" > "$LAYA_ASSET.sha256"
          gh release view "$LAYA_TAG" >/dev/null 2>&1 || gh release create "$LAYA_TAG" --target "$GITHUB_SHA" --prerelease --latest=false \
            --title "Laya runtime ${LAYA_TAG#laya-}" --notes "Laya's Python for Team Chat (macapp/laya.sh). The app downloads it when it needs it."
          gh release upload "$LAYA_TAG" "$LAYA_ASSET" "$LAYA_ASSET.sha256" --clobber

      - name: Build the app
        run: |
          TEAM_CHAT_VERSION="$VERSION" TEAM_CHAT_WITHOUT_LAYA=1 TEAM_CHAT_BRANCH=main \
            TEAM_CHAT_REPO="https://github.com/${GITHUB_REPOSITORY}.git" bash macapp/build.sh
          ditto -c -k --sequesterRsrc --keepParent "build/Team Chat.app" Team-Chat-arm64.zip
          shasum -a 256 Team-Chat-arm64.zip > Team-Chat-arm64.zip.sha256
          cat "build/Team Chat.app/Contents/Resources/build.json"

      - name: Publish the release
        run: |
          gh release create "$GITHUB_REF_NAME" Team-Chat-arm64.zip Team-Chat-arm64.zip.sha256 \
            --verify-tag --latest --title "Team Chat $VERSION" --generate-notes
