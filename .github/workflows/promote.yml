# Gives a beta build to everyone: marks a release as a full release and the latest one, which is what installed apps on
# the stable channel (updates.ts) and install.sh pick up. Run it from the Actions tab with the tag, e.g. v2.1.7.
# Pushes to main are published as prereleases by release.yml; this is the manual step after them.
name: Promote

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Tag of the release to promote (v2.1.7)
        required: true
        type: string

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ inputs.tag }}
    steps:
      - name: Make it the latest release
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Tags look like v1.2.3, not $TAG"; exit 1; }
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --prerelease=false --latest
