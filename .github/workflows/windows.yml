# Builds the Windows server (harmonia-server.exe) on a Windows runner and checks that it starts and serves the page.
# Releases get the same build from release.yml (Harmonia-windows-x64.zip); this keeps it working between releases.
name: Windows

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Build
        run: bun run build:windows

      - name: Smoke test (stub teammates)
        shell: pwsh
        run: |
          $env:HARMONIA_STUB = "1"
          $env:PORT = "4790"
          $env:HARMONIA_DATA = "$env:RUNNER_TEMP\harmonia-data"
          $p = Start-Process -FilePath build\windows\harmonia-server.exe -PassThru -NoNewWindow `
            -RedirectStandardOutput "$env:RUNNER_TEMP\out.log" -RedirectStandardError "$env:RUNNER_TEMP\err.log"
          $ok = $false
          foreach ($i in 1..30) {
            try { if ((Invoke-WebRequest -UseBasicParsing http://127.0.0.1:4790/).StatusCode -eq 200) { $ok = $true; break } } catch {}
            Start-Sleep -Seconds 1
          }
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          Get-Content "$env:RUNNER_TEMP\out.log", "$env:RUNNER_TEMP\err.log" -ErrorAction SilentlyContinue
          if (-not $ok) { throw "harmonia-server.exe didn't answer on 4790" }

      - uses: actions/upload-artifact@v4
        with:
          name: harmonia-windows-x64
          path: build/windows/harmonia-server.exe
