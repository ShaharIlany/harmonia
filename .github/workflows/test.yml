# Runs the tests (`bun test`: unit tests plus one end-to-end run of the server with stub teammates).
# A check on pull requests and branches only. It is not part of the release path: pushes to main don't run it.
name: Test

on:
  pull_request:
  push:
    branches-ignore: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - run: bun install --frozen-lockfile

      - run: bun run typecheck

      - run: bun test
